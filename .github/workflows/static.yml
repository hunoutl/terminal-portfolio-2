# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔹 Étape pour remplacer la clé par le secret avec log global
      - name: Replace API key placeholder
        run: |
          replaced=0
          for file in $(find ./assets -type f -name "index*.js"); do
            if grep -q 'DEFAULT_API_KEY:"' "$file"; then
              sed -i "s/DEFAULT_API_KEY:\"[^\"]*\"/DEFAULT_API_KEY:\"${{ secrets.HF_API_KEY }}\"/g" "$file"
              replaced=1
            fi
          done

          if [ $replaced -eq 1 ]; then
            echo "✅ La clé API a été remplacée dans au moins un fichier."
          else
            echo "⚠️ Aucune clé API DEFAULT_API_KEY n'a été trouvée dans ./assets."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
